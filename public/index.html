<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EggSport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061f55">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>EggSport</title>
<script>if (sessionStorage.getItem("eggsport-launched")) document.documentElement.classList.add("returning");</script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#061f55;color:#e2e8f0;font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#splash{position:fixed;inset:0;background:#061f55;display:grid;place-items:center;z-index:10;opacity:1;transition:opacity .35s ease}
#splash img{width:100%;height:100%;object-fit:cover}
#splash.hidden{opacity:0;pointer-events:none}
html.returning #splash{display:none}
#app{min-height:100vh}
header{position:sticky;top:0;background:#061f55;padding:8px 10px;display:grid;grid-template-columns:40px minmax(0,1fr) auto 40px;align-items:center;border-bottom:1px solid #123670;z-index:1}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}
.brand a{display:flex;flex:none}
.brand img{width:62px;height:62px;object-fit:contain}
header h1{font-size:18px;line-height:1.1;margin:0;text-align:left;white-space:nowrap}
.egg{color:#f8fafc}
.sport{color:#4ade80}
header small{display:block;font-weight:400;color:#94a3b8;font-size:11px;margin-top:4px}
button{background:#1e293b;color:#e2e8f0;border:0;border-radius:8px;padding:8px 14px;font-size:16px}
#filter{padding:6px 9px;font-size:13px;margin:0 4px;background:#fbbf24;color:#0f172a;font-weight:600}
.controls{display:flex;gap:8px;padding:10px 14px 4px;position:sticky;top:78px;background:#061f55;z-index:1}
select{min-width:0;flex:1;background:#1e293b;color:#e2e8f0;border:0;border-radius:8px;padding:8px;font-size:14px}
main{padding:6px 14px 80px;min-height:calc(100vh - 110px)}
.back{display:inline-block;color:#fbbf24;text-decoration:none;margin:10px 0 4px}
.detail h2{margin:10px 0 4px}.detail .sub{color:#94a3b8;margin:0 0 18px}
.detail .teams{background:#1e293b;border-radius:10px;padding:14px;margin:12px 0}
.detail .team{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:18px}
.detail .team span:first-child{display:flex;align-items:center;gap:8px}
.detail .team img{width:30px;height:30px;object-fit:contain}
.detail .score{font-size:22px}
.about{max-width:460px;margin:12px auto;text-align:center}
.about h2{font-size:28px;margin:10px 0 4px}
.about .tagline{color:#4ade80;font-weight:600;margin:0 0 14px}
.about img{display:block;width:min(100%,330px);margin:0 auto 18px}
.about p{color:#cbd5e1;line-height:1.55;text-align:left}
.day{margin-top:18px}
.day h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin:0 0 6px}
.day.today h2{color:#fbbf24}
.sport{font-weight:600;margin:10px 0 4px}
.game{display:block;color:inherit;text-decoration:none;background:#1e293b;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.meta{font-size:12px;color:#94a3b8;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.t{display:flex;align-items:center;gap:8px}
.t img{width:22px;height:22px;object-fit:contain}
.venue{font-size:12px;color:#94a3b8;margin-top:6px}
.mine{font-weight:700}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.live{color:#f87171}
.empty,.err{color:#94a3b8;text-align:center;margin-top:40px}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading EggSport"><img src="splash.png" alt="EggSport"></div>
<div id="app">
<header>
  <button id="prev" aria-label="Previous week">&lsaquo;</button>
  <div class="brand"><a href="?about=1" aria-label="About EggSport"><img src="icon.png" alt=""></a><h1 id="title"><span class="egg">Egg</span><span class="sport">Sport</span><small id="range"></small></h1></div>
  <button id="filter" aria-label="Filter games"></button>
  <button id="next" aria-label="Next week">&rsaquo;</button>
</header>
<div class="controls" id="controls">
  <select id="sportFilter" aria-label="Filter by sport"></select>
  <select id="teamFilter" aria-label="Filter by team"></select>
</div>
<main id="main"><p class="empty">Loading&hellip;</p></main>
</div>
<script src="app.js"></script>
</body>
</html>
