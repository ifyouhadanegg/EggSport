<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EggSport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<title>EggSport</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#e2e8f0;font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:#0f172a;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;z-index:1}
header h1{font-size:17px;margin:0;text-align:center;flex:1}
header small{display:block;font-weight:400;color:#94a3b8;font-size:12px}
button{background:#1e293b;color:#e2e8f0;border:0;border-radius:8px;padding:8px 14px;font-size:16px}
#filter{padding:6px 10px;font-size:14px;margin:0 6px;background:#fbbf24;color:#0f172a;font-weight:600}
main{padding:6px 14px 80px;min-height:calc(100vh - 110px)}
.day{margin-top:18px}
.day h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin:0 0 6px}
.day.today h2{color:#fbbf24}
.sport{font-weight:600;margin:10px 0 4px}
.game{background:#1e293b;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.meta{font-size:12px;color:#94a3b8;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.t{display:flex;align-items:center;gap:8px}
.t img{width:22px;height:22px;object-fit:contain}
.venue{font-size:12px;color:#94a3b8;margin-top:6px}
.mine{font-weight:700}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.live{color:#f87171}
.empty,.err{color:#94a3b8;text-align:center;margin-top:40px}
</style>
</head>
<body>
<header>
  <button id="prev" aria-label="Previous week">&lsaquo;</button>
  <h1 id="title">EggSport<small id="range"></small></h1>
  <button id="filter" aria-label="Filter games"></button>
  <button id="next" aria-label="Next week">&rsaquo;</button>
</header>
<main id="main"><p class="empty">Loading&hellip;</p></main>
<script src="app.js"></script>
</body>
</html>
